[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-rt"
version = "0.2.1"
description = "Site-operations fusion runtime: correlator, rules, zones, incidents, threat, scene synthesis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "aiomqtt>=2.3",
    "sse-starlette>=1.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "ss-common[web,mqtt]",
    "ss-perception",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"selfsuvis.fusion_rt" = ["data/*.yaml"]

[tool.uv.sources]
ss-common = { git = "https://github.com/volod/ss-common", tag = "v0.1.0" }
ss-perception = { workspace = true }
