manifests:
  - manifest_id: demo-alpha
    version: "1.0.0"
    name: Demo alpha
    ports_in:
      - {name: run_dir, type: path}
    ports_out:
      - {name: marker, type: path}
    tiers:
      - {name: cpu, device_class: cpu, latency_ms: 100, vram_mb: 0, quality: 1.0}
    binding: "python:ss_kernel.demo:write_marker"
    skip_flags: []
    wrap: independent
