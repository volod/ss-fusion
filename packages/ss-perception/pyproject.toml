[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-perception"
version = "0.2.1"
description = "Shared perception: vision models, inference wrappers, frame I/O, vector index"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "plyfile>=0.9",
    "tqdm>=4.66",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "qdrant-client>=1.19.1,<2",
    "openai>=1.0",
    "ss-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"selfsuvis" = ["env/*.env"]

[tool.uv.sources]
ss-common = { git = "https://github.com/volod/ss-common", tag = "v0.1.0" }
