[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-mapping"
version = "0.1.0"
description = "Shared mapping: SfM, splats, GPS registration, semantic graph"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "plyfile>=0.9",
    "ss-perception",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
ss-common = { git = "https://github.com/volod/ss-common", tag = "v0.1.0" }
ss-perception = { workspace = true }
